# Packaging for the two Windows artifacts.
#
# `dependencies` in package.json is deliberately empty: the three workspace packages are bundled
# into out/ by electron-vite (see the comment in electron.vite.config.ts), so nothing has to be
# resolved at pack time. That is what keeps electron-builder away from `install-app-deps`, which
# is the part that misbehaves when npm workspaces hoist everything to the root node_modules.
#
# `electronVersion` is pinned for the same reason — electron is hoisted to the repo root, and
# electron-builder cannot always compute the version from packages/app on its own.
appId: com.ryongen.cte2pob
productName: CTE2 Build Planner
electronVersion: 43.4.0

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

portable:
  artifactName: ${productName}-${version}-portable.exe
