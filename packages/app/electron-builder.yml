# Packaging for the two Windows artifacts.
#
# `dependencies` in package.json is deliberately empty: the three workspace packages are bundled
# into out/ by electron-vite (see the comment in electron.vite.config.ts), so nothing has to be
# resolved at pack time. That is what keeps electron-builder away from `install-app-deps`, which
# is the part that misbehaves when npm workspaces hoist everything to the root node_modules.
#
# `electronVersion` is pinned for the same reason — electron is hoisted to the repo root, and
# electron-builder cannot always compute the version from packages/app on its own.
#
# `appId` is how Windows and the auto-updater recognise an existing install. Changing it after a
# release makes the next installer sit beside the old one instead of replacing it — leave it be.
appId: com.ryongen.cob
productName: Craft of Building
electronVersion: 43.4.0

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true

# Where installed copies look for updates (see src/main/updater.ts). This also makes `dist` write
# `latest.yml` beside the installer; a release needs it, the installer and its .blockmap, or no
# installed copy will ever see it. `npm run release` builds and uploads all three, as a draft,
# with a GH_TOKEN in the environment; publish the draft on GitHub to ship it.
publish:
  provider: github
  owner: Ryongen
  repo: cte2-pob
  releaseType: draft

win:
  # `build/icon.ico` — seven sizes from 16 to 256, generated from the repo-root CTE2COB.jpg.
  # electron-builder would find it under `buildResources` anyway; it is named because a missing
  # icon is silent (you get Electron's own) and that is the kind of thing nobody notices until
  # the installer is in somebody else's hands.
  #
  # To regenerate after replacing the source image, from the repo root:
  #   powershell -File tools/make-icons.ps1
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

# No spaces in either name. `latest.yml` records the installer's name with dashes, while a file
# uploaded to a release by hand has its spaces turned into dots — so a spaced name only works
# when electron-builder does the upload, and the updater 404s otherwise.
nsis:
  artifactName: Craft-of-Building-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

portable:
  artifactName: Craft-of-Building-${version}-portable.${ext}
